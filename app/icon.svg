  <!-- Monogram A -->
  <text x="32" y="47" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="600" text-anchor="middle" fill="url(#goldGrad)">A</text>
  <!-- Sparkle Accent -->
  <path d="M45 22 Q45 25 47 25 Q45 25 45 28 Q45 25 43 25 Q45 25 45 22 Z" fill="#F5E6BD" />
